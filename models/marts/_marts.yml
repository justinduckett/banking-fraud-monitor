version: 2

models:
  - name: fraud_features
    description: >
      The central feature store for fraud analysis. One row per transaction,
      enriched with behavioral lookback metrics and rule-based risk flags.
      Rules are a triage layer: they prioritize transactions for manual review
      and are deliberately tuned to over-flag (false positives cost analyst
      minutes, false negatives cost fraud losses).
    columns:
      - name: transaction_id
        description: "Primary key. One row per transaction."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key to the customer. Cast as STRING to prevent accidental aggregation in BI tools."
        tests:
          - not_null

      - name: transaction_at
        description: "When the transaction occurred (UTC). Window features are ordered by this timestamp."

      - name: amount
        description: "Transaction value in CAD (NUMERIC). Compared against avg_spend_30_days by risk rule 1."

      - name: category
        description: "Merchant category of the purchase. High-risk categories (gift cards, crypto, online gaming) feature heavily in simulated fraud."

      - name: is_suspicious_flag
        description: >
          Ground truth label from the data simulator. Retained solely to
          evaluate rule performance (comparing flags against known fraud);
          never used as an input to the risk rules themselves.

      - name: velocity_last_hour
        description: >
          Velocity risk metric. Count of all transactions by this customer_id
          in the rolling window [T minus 1 hour, T], including the current
          transaction. Minimum possible value is therefore 1.
        tests:
          - not_null
          # Logic test: velocity can never be less than 1 (the current transaction itself)
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"

      - name: avg_spend_30_days
        description: >
          Baseline spending metric. Average amount for this customer over the
          preceding 30 days, EXCLUDING the current transaction so the baseline
          is not contaminated by the event being scored. NULL for a customer's
          first observed transaction (no prior history exists).

      - name: is_high_amount_spike
        description: >
          Risk rule 1. TRUE when amount exceeds 5x avg_spend_30_days.
          Policy: a customer's first transaction is never flagged because no
          baseline exists to compare against. Consumed by the 'High risk by
          spend' dashboard views.
        tests:
          - not_null

      - name: is_velocity_attack
        description: >
          Risk rule 2. TRUE when velocity_last_hour exceeds 3, the signature
          of card testing attacks (rapid small purchases validating a stolen
          card). Threshold lives here, not in the BI layer, so it is version
          controlled and tested. Consumed by the 'High risk by velocity'
          dashboard views.
        tests:
          - not_null

      - name: transaction_type
        description: >
          Single classification of every transaction, derived from the two
          risk rules: 'normal', 'high_amount_spike', 'velocity_attack', or
          'spike_and_velocity' when both rules fire. 'normal' is an explicit
          value rather than NULL so BI tools can chart and filter without
          null handling. Powers the triage feed filter and the transaction
          trend breakdown on the dashboard.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - normal
                  - high_amount_spike
                  - velocity_attack
                  - spike_and_velocity